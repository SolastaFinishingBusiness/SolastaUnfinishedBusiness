# Builds the mod and publishes a GitHub release whenever a version tag is pushed (e.g. `git push origin 1.6.1.1`).
# The tag must match Info.json's Version and must not have been released before; the release notes are that
# version's entry in ChangelogHistory.txt, and the title is the version plus the Solasta version it was built for.
# A failed release can be re-run by hand from the Actions tab by choosing the version tag as the ref.
# A push to any branch (or a run by hand on a branch) only builds: the zip is kept as the run's artifact
# "SolastaUnfinishedBusiness-<version>-dev.<commit>" for testing, and nothing is released. Artifacts are kept for a
# limited time (user direction, 2026-11-02: "build from any branch, but ensure that the lifespan of artifacts will be
# limited"): 14 days for develop's builds, which are the release candidates, and 5 days for every other branch's.
# Versions (user direction, 2026-11-02): Info.json holds the last release's version between releases; the release
# commit raises it and renames ChangelogHistory.txt's "Unreleased:" entry to it. A development build (every build but
# a tag's) is marked "<version>-dev.<first 8 characters of the commit>" in its built Info.json (the project file's
# StampBuildVersion); a tag's build carries the plain version.

name: .NET

on:
  push:
      branches:
        - '**'
      tags:
        - '*'
  workflow_dispatch:
env:
  SolastaInstallDir: ../SolastaFiles
permissions:
  contents: write
jobs:
  build:

    runs-on: ubuntu-latest

    # The actions are at majors built for Node.js 24 (checkout v7, setup-dotnet v6, upload-artifact v7, 2026-11-14):
    # GitHub has retired Node.js 20, and the v4 actions were forced onto Node.js 24 with a warning on every run.
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .Version SolastaUnfinishedBusiness/Info.json)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Info.json Version $version"
            exit 1
          fi
      - name: Check the version wasn't released before
        if: github.ref_type == 'tag'
        # every numbered release must be a unique build: the mod shows the version alone, so a moved tag must not
        # publish different files under a number players already have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Version $GITHUB_REF_NAME was already released; bump the version instead"
            exit 1
          fi
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore SolastaUnfinishedBusiness.sln
      - name: Clean
        run: dotnet clean SolastaUnfinishedBusiness.sln
      - name: Build
        # every build but a version tag's is a development build (FbDevelopmentBuild, see the project file): it has the
        # development-only tools and a "-dev.<commit>" version, a tag's release build has neither
        run: >-
          dotnet build SolastaUnfinishedBusiness.sln --no-restore -c "Release Workflow"
          -p:FbDevelopmentBuild=${{ github.ref_type != 'tag' }}
      - name: Check development-only tools
        # each development-only tool's entry point must be in a test build (so this check means something) and must not
        # be in a release build: the vote screen preview (MultiplayerVoteContext.StartPreview) and the update progress
        # preview (UpdateContext.StartProgressPreview)
        run: |
          dll=SolastaFiles/Mods/SolastaUnfinishedBusiness/SolastaUnfinishedBusiness.dll
          for entry in StartPreview StartProgressPreview; do
            if grep -q -a "$entry" "$dll"; then found=true; else found=false; fi
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$found" = true ]; then
              echo "::error::The release build contains the development-only tool $entry"
              exit 1
            fi
            if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$found" = false ]; then
              echo "::error::The test build is missing the development-only tool $entry; FB_DEVELOPMENT wasn't set"
              exit 1
            fi
          done
      - name: Zip Files
        run: |
          cd SolastaFiles/Mods
          zip -r -q "$GITHUB_WORKSPACE/SolastaUnfinishedBusiness.zip" SolastaUnfinishedBusiness
      - name: Check the build's version
        # a tag's build carries exactly the tag, and its DLL's product version no commit ("+<commit>"); any other build
        # the source version marked with "-dev." and the commit
        run: |
          built=$(jq -r .Version SolastaFiles/Mods/SolastaUnfinishedBusiness/Info.json)
          source=$(jq -r .Version SolastaUnfinishedBusiness/Info.json)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then expected="$GITHUB_REF_NAME"; else expected="$source-dev.${GITHUB_SHA::8}"; fi
          if [ "$built" != "$expected" ]; then
            echo "::error::The built Info.json says $built, expected $expected"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] &&
            grep -q -a -E '\+[0-9a-f]{40}' SolastaFiles/Mods/SolastaUnfinishedBusiness/SolastaUnfinishedBusiness.dll; then
            echo "::error::The release DLL's product version carries a commit"
            exit 1
          fi
          echo "Built version: $built"
      - name: Name the test build
        if: github.ref_type != 'tag'
        run: echo "ARTIFACT=SolastaUnfinishedBusiness-$(jq -r .Version SolastaFiles/Mods/SolastaUnfinishedBusiness/Info.json)" >> "$GITHUB_ENV"
      - name: Keep the test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: SolastaUnfinishedBusiness.zip
          retention-days: ${{ github.ref == 'refs/heads/develop' && 14 || 5 }}
      - name: Check a release build has no development-only tools
        if: github.ref_type != 'tag'
        # builds the code once more as a version tag would (after the test build was kept, so its files can be
        # replaced) and checks no development-only tool is in it and its version is the plain source version, with
        # neither "-dev" nor the commit (in Info.json or the DLL's product version), so the release side of the checks
        # above is proven on every run, not first at a release; nothing is published
        run: |
          dotnet build SolastaUnfinishedBusiness.sln --no-restore --no-incremental -c "Release Workflow" \
            -p:FbDevelopmentBuild=false
          dll=SolastaFiles/Mods/SolastaUnfinishedBusiness/SolastaUnfinishedBusiness.dll
          for entry in StartPreview StartProgressPreview; do
            if grep -q -a "$entry" "$dll"; then
              echo "::error::A release build would contain the development-only tool $entry"
              exit 1
            fi
          done
          built=$(jq -r .Version SolastaFiles/Mods/SolastaUnfinishedBusiness/Info.json)
          source=$(jq -r .Version SolastaUnfinishedBusiness/Info.json)
          if [ "$built" != "$source" ]; then
            echo "::error::A release build's Info.json would say $built, not $source"
            exit 1
          fi
          if grep -q -a -E '\+[0-9a-f]{40}' "$dll"; then
            echo "::error::A release build's DLL product version would carry the commit"
            exit 1
          fi
          echo "Release build version: $built"
      - name: Release Notes
        if: github.ref_type == 'tag'
        # the version's changelog entry: the lines after "<version>:" up to the next blank line
        run: |
          tr -d '\r' < SolastaUnfinishedBusiness/ChangelogHistory.txt |
            awk -v header="$GITHUB_REF_NAME:" '$0 == header { found = 1; next } found && $0 == "" { exit } found' \
            > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No ChangelogHistory.txt entry for $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Publish Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # titled with the version and the Solasta version it was built for (Info.json GameVersion)
        run: |
          game_version=$(jq -r .GameVersion SolastaUnfinishedBusiness/Info.json)
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "$GITHUB_REF_NAME (Solasta $game_version)" \
            --notes-file release-notes.md \
            SolastaUnfinishedBusiness.zip SolastaFiles/Mods/SolastaUnfinishedBusiness/Info.json
