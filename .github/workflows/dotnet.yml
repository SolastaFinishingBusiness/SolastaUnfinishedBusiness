# Builds the mod and publishes a GitHub release whenever a version tag is pushed (e.g. `git push origin 1.19.0`).
# The tag must match Info.json's Version and must not have been released before; the release notes are that
# version's section of Documentation/ChangelogHistory.md, and the title is the version plus the Solasta version it was
# built for. A failed release can be re-run by hand from the Actions tab by choosing the version tag as the ref.
# A push to any branch (or a run by hand on a branch) only builds: the zip is kept as the run's artifact
# "SolastaUnfinishedBusiness-<version>-dev.<commit>" for testing, and nothing is released. Artifacts are kept 14 days
# for develop's builds, which are the release candidates, and 5 days for every other branch's.
# Versions: right after a release, the job bump-develop raises develop's Info.json to the next minor version (1.20.0
# after 1.19.0), so its development builds sort above every earlier release and below their own release (SemVer pre-release order, used
# by the in-game updater). The release commit sets the final number from what the release holds (kept, lowered to a
# patch such as 1.18.1, or raised to a major) and gathers unreleased/ into a new section of the changelog.
# A development build (every build but a tag's) is marked "<version>-dev.<first 8 characters of the commit>" in its
# built Info.json (the project file's StampBuildVersion); a tag's build carries the plain version.

name: .NET

on:
  push:
      branches:
        - '**'
      tags:
        - '*'
  workflow_dispatch:
env:
  SolastaInstallDir: ../SolastaFiles
permissions:
  contents: write
  # for the last step of a tag's run: relabelling the issues fixed in the release (.github/scripts/issue-status.js)
  issues: write
  pull-requests: read
jobs:
  build:

    runs-on: ubuntu-latest

    # The actions are at majors built for Node.js 24 (checkout v7, setup-dotnet v6, upload-artifact v7, 2026-11-14):
    # GitHub has retired Node.js 20, and the v4 actions were forced onto Node.js 24 with a warning on every run.
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .Version SolastaUnfinishedBusiness/Info.json)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Info.json Version $version"
            exit 1
          fi
      - name: Check the version wasn't released before
        if: github.ref_type == 'tag'
        # every numbered release must be a unique build: the mod shows the version alone, so a moved tag must not
        # publish different files under a number players already have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Version $GITHUB_REF_NAME was already released; bump the version instead"
            exit 1
          fi
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore SolastaUnfinishedBusiness.sln
      - name: Clean
        run: dotnet clean SolastaUnfinishedBusiness.sln
      - name: Build
        # every build but a version tag's is a development build (FbDevelopmentBuild, see the project file): it has the
        # development-only tools and a "-dev.<commit>" version, a tag's release build has neither
        run: >-
          dotnet build SolastaUnfinishedBusiness.sln --no-restore -c "Release Workflow"
          -p:FbDevelopmentBuild=${{ github.ref_type != 'tag' }}
      - name: Check development-only tools
        # each development-only tool's entry point must be in a test build (so this check means something) and must not
        # be in a release build: the vote screen preview (MultiplayerVoteContext.StartPreview) and the update progress
        # preview (UpdateContext.StartProgressPreview)
        run: |
          dll=SolastaFiles/Mods/SolastaUnfinishedBusiness/SolastaUnfinishedBusiness.dll
          for entry in StartPreview StartProgressPreview; do
            if grep -q -a "$entry" "$dll"; then found=true; else found=false; fi
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$found" = true ]; then
              echo "::error::The release build contains the development-only tool $entry"
              exit 1
            fi
            if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$found" = false ]; then
              echo "::error::The test build is missing the development-only tool $entry; FB_DEVELOPMENT wasn't set"
              exit 1
            fi
          done
      - name: Zip Files
        run: |
          cd SolastaFiles/Mods
          zip -r -q "$GITHUB_WORKSPACE/SolastaUnfinishedBusiness.zip" SolastaUnfinishedBusiness
      - name: Check the build's version
        # a tag's build carries exactly the tag, and its DLL's product version no commit ("+<commit>"); any other build
        # the source version marked with "-dev." and the commit
        run: |
          built=$(jq -r .Version SolastaFiles/Mods/SolastaUnfinishedBusiness/Info.json)
          source=$(jq -r .Version SolastaUnfinishedBusiness/Info.json)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then expected="$GITHUB_REF_NAME"; else expected="$source-dev.${GITHUB_SHA::8}"; fi
          if [ "$built" != "$expected" ]; then
            echo "::error::The built Info.json says $built, expected $expected"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] &&
            grep -q -a -E '\+[0-9a-f]{40}' SolastaFiles/Mods/SolastaUnfinishedBusiness/SolastaUnfinishedBusiness.dll; then
            echo "::error::The release DLL's product version carries a commit"
            exit 1
          fi
          echo "Built version: $built"
      - name: Check the changelog
        if: github.ref_type != 'tag'
        # the zip ships the changelog in the mod's Documentation folder and no longer at the mod's root, and the
        # newest release's section can be read the way a tag's run reads its release notes
        run: |
          # the listing is read once into a variable, so no pipe's early exit can decide a check
          listing=$(unzip -l SolastaUnfinishedBusiness.zip)
          grep -q ' SolastaUnfinishedBusiness/Documentation/ChangelogHistory.md$' <<< "$listing" ||
            { echo "::error::The zip has no Documentation/ChangelogHistory.md"; exit 1; }
          if grep -q ' SolastaUnfinishedBusiness/ChangelogHistory.txt$' <<< "$listing"; then
            echo "::error::The zip still has ChangelogHistory.txt"; exit 1
          fi
          newest=$(sed -n 's/^### //p' Documentation/ChangelogHistory.md | tr -d '\r' | sed -n '1p')
          # its own assignment, so a failing extractor fails the step
          notes=$(.github/scripts/release-notes.sh "$newest" Documentation/ChangelogHistory.md)
          if [ -z "$notes" ]; then
            echo "::error::The section '### $newest' of the changelog came out empty"; exit 1
          fi
          echo "Newest changelog section: $newest"
      - name: Check the post-release version logic
        if: github.ref_type != 'tag'
        run: .github/scripts/next-version.sh --test
      - name: Name the test build
        if: github.ref_type != 'tag'
        run: echo "ARTIFACT=SolastaUnfinishedBusiness-$(jq -r .Version SolastaFiles/Mods/SolastaUnfinishedBusiness/Info.json)" >> "$GITHUB_ENV"
      - name: Keep the test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: SolastaUnfinishedBusiness.zip
          retention-days: ${{ github.ref == 'refs/heads/develop' && 14 || 5 }}
      - name: Check a release build has no development-only tools
        if: github.ref_type != 'tag'
        # builds the code once more as a version tag would (after the test build was kept, so its files can be
        # replaced) and checks no development-only tool is in it and its version is the plain source version, with
        # neither "-dev" nor the commit (in Info.json or the DLL's product version), so the release side of the checks
        # above is proven on every run, not first at a release; nothing is published
        run: |
          dotnet build SolastaUnfinishedBusiness.sln --no-restore --no-incremental -c "Release Workflow" \
            -p:FbDevelopmentBuild=false
          dll=SolastaFiles/Mods/SolastaUnfinishedBusiness/SolastaUnfinishedBusiness.dll
          for entry in StartPreview StartProgressPreview; do
            if grep -q -a "$entry" "$dll"; then
              echo "::error::A release build would contain the development-only tool $entry"
              exit 1
            fi
          done
          built=$(jq -r .Version SolastaFiles/Mods/SolastaUnfinishedBusiness/Info.json)
          source=$(jq -r .Version SolastaUnfinishedBusiness/Info.json)
          if [ "$built" != "$source" ]; then
            echo "::error::A release build's Info.json would say $built, not $source"
            exit 1
          fi
          if grep -q -a -E '\+[0-9a-f]{40}' "$dll"; then
            echo "::error::A release build's DLL product version would carry the commit"
            exit 1
          fi
          echo "Release build version: $built"
      - name: Release Notes
        if: github.ref_type == 'tag'
        run: |
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" Documentation/ChangelogHistory.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '### $GITHUB_REF_NAME' section in Documentation/ChangelogHistory.md"
            exit 1
          fi
      - name: Publish Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # titled with the version and the Solasta version it was built for (Info.json GameVersion)
        run: |
          game_version=$(jq -r .GameVersion SolastaUnfinishedBusiness/Info.json)
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "$GITHUB_REF_NAME (Solasta $game_version)" \
            --notes-file release-notes.md \
            SolastaUnfinishedBusiness.zip SolastaFiles/Mods/SolastaUnfinishedBusiness/Info.json
      - name: Mark the issues fixed in this release as released
        if: github.ref_type == 'tag'
        # Here rather than in a workflow started by the release: a release created with the workflow's own token
        # starts no other workflow. The release is already published, so a failure here must not fail the run; the
        # run's summary lists the issues relabelled, which still need their release comments.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-status.js`);
            await run({ github, context, core });

  # Raises develop to the next minor version once a tag's release is published, so develop's test builds sort above it.
  # It pushes straight to develop with DEVELOP_PUSH_TOKEN, a token of an account allowed to bypass develop's pull
  # request rule; the secret lives in the "release" environment, which only version tags may use, so branch runs never
  # see it. The workflow's own token can't push there. A failure here leaves the release published: re-run only this
  # job from the run's page (a full re-run stops at the "already released" check).
  bump-develop:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      # the scripts come from the released commit; develop's files are only read and edited, never run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Raise develop to the next minor version
        env:
          TOKEN: ${{ secrets.DEVELOP_PUSH_TOKEN }}
        # Each attempt starts from a fresh clone of develop's tip, works out again whether a raise is due, and makes a
        # new commit, so a push rejected because develop moved never reuses a commit made on an older tip.
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DEVELOP_PUSH_TOKEN isn't set in the release environment"
            exit 1
          fi
          next_version="$GITHUB_WORKSPACE/.github/scripts/next-version.sh"
          remote="https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git"
          work="$RUNNER_TEMP/develop"
          for attempt in 1 2 3; do
            rm -rf "$work"
            info=SolastaUnfinishedBusiness/Info.json
            project=SolastaUnfinishedBusiness/SolastaUnfinishedBusiness.csproj
            # only develop's tip, and only the two files the raise edits
            git clone --quiet --depth 1 --branch develop --filter=blob:none --no-checkout "$remote" "$work"
            cd "$work"
            git sparse-checkout set --no-cone "/$info" "/$project"
            git checkout --quiet develop
            current=$(jq -r .Version "$info")
            assembly=$(sed -n 's|^ *<AssemblyVersion>\(.*\)</AssemblyVersion>.*$|\1|p' "$project")
            if [ "$assembly" != "$current" ]; then
              echo "::error::develop's Info.json says $current but its AssemblyVersion says $assembly"
              exit 1
            fi
            next=$("$next_version" "$GITHUB_REF_NAME" "$current")
            if [ -z "$next" ]; then
              echo "develop carries $current; no raise needed after $GITHUB_REF_NAME"
              exit 0
            fi
            # only the two version values change; the files keep their formatting, line endings and byte order mark
            sed -i "s|^\(  \"Version\": \"\)$current\(\",\)|\1$next\2|" "$info"
            sed -i "s|^\( *<AssemblyVersion>\)$current\(</AssemblyVersion>\)|\1$next\2|" "$project"
            if [ "$(jq -r .Version "$info")" != "$next" ] ||
              [ "$(sed -n 's|^ *<AssemblyVersion>\(.*\)</AssemblyVersion>.*$|\1|p' "$project")" != "$next" ] ||
              [ "$(git diff --numstat | awk '{ added += $1; removed += $2 } END { print added "/" removed "/" NR }')" != "2/2/2" ]; then
              echo "::error::The version edit didn't change exactly the two version lines"
              git diff
              exit 1
            fi
            git -c user.name="Mira Dev Agent" -c user.email=mira.dev.agent@gmail.com commit --quiet -a \
              -m "Release workflow: develop carries $next after the $GITHUB_REF_NAME release"
            if git push --quiet origin HEAD:develop; then
              echo "develop raised from $current to $next"
              exit 0
            fi
            echo "::warning::Push attempt $attempt was rejected; starting again from develop's tip"
            cd "$GITHUB_WORKSPACE"
          done
          echo "::error::develop couldn't be raised to the next version after 3 attempts; the release is published"
          exit 1
